name: Publish to Visual Studio Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag
        required: true
        default: v0.1.15
        type: string

permissions: {}

jobs:
  publish:
    if: github.repository == 'qigao/slates-extension' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency: marketplace-publish
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the released VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          published_tag=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select((.isDraft or .isPrerelease) | not).tagName')
          [[ "$published_tag" == "$TAG" ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "slate-${TAG#v}.vsix" --pattern SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Publish the VSIX
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath "slate-${TAG#v}.vsix"
